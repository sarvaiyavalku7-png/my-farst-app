name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
        else
          gradle wrapper
          chmod +x gradlew
        fi

    - name: Build APK
      run: ./gradlew assembleDebug -x test -x validateSigningDebug --continue

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
